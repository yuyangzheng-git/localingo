<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocaLingo · 读懂，不打断</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="identity">
        <img src="icons/mark.svg" alt="" width="32" height="32" />
        <div>
          <h1>LocaLingo<span>.</span></h1>
          <p>读懂，不打断。</p>
        </div>
      </div>
      <button
        class="status"
        id="status"
        data-state="checking"
        type="button"
        aria-label="重新检查本地服务"
      >
        <span class="dot" aria-hidden="true"></span
        ><span id="statusText">检查中</span>
      </button>
    </header>
    <main>
      <section class="page-card" aria-labelledby="pageTitle">
        <div class="page-top">
          <span class="eyebrow">THIS PAGE / 当前页面</span
          ><span class="language"
            >EN <span aria-hidden="true">→</span> 简体中文</span
          >
        </div>
        <h2 id="pageTitle">正在读取页面…</h2>
        <p class="page-host" id="pageHost">优先翻译正在阅读的内容</p>
        <div class="page-state">
          <span class="state-dot" id="pageDot" aria-hidden="true"></span>
          <p id="pageState" role="status">正在检查页面</p>
        </div>
        <div class="activity" id="activity" hidden><span></span></div>
        <div class="metrics" id="metrics" hidden aria-label="当前页翻译统计">
          <div><strong id="translatedCount">0</strong><span>新翻译</span></div>
          <div><strong id="cachedCount">0</strong><span>来自缓存</span></div>
          <div><strong id="failedCount">0</strong><span>失败段落</span></div>
        </div>
      </section>
      <div class="notice" id="notice" role="status" hidden></div>
      <div class="setup" id="setup" hidden>
        <button type="button" class="secondary connect" id="installLink">
          打开一键安装页面 <span aria-hidden="true">↗</span>
        </button>
      </div>
      <div class="page-error" id="pageError" hidden>
        <p id="pageErrorText"></p>
        <button id="retryFailed" class="text-button" type="button">
          重试失败段落 <span aria-hidden="true">↻</span>
        </button>
      </div>
      <section class="reading" aria-labelledby="readingTitle">
        <div class="section-heading">
          <h2 id="readingTitle">你的阅读方式</h2>
          <span>即时应用</span>
        </div>
        <div
          class="segmented"
          role="radiogroup"
          aria-label="显示方式"
          id="displayMode"
        >
          <button
            type="button"
            role="radio"
            data-value="learn"
            aria-checked="false"
            tabindex="-1"
            class="wide"
          >
            <span class="mode-drawing learn" aria-hidden="true"
              ><i></i><i></i><i></i><b>译</b></span
            ><span
              ><strong>学习阅读</strong
              ><small>先读原文，点段落末尾「译」只看这一段</small></span
            ><span class="radio-dot" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            role="radio"
            data-value="bilingual"
            aria-checked="true"
            tabindex="0"
          >
            <span class="mode-drawing" aria-hidden="true"
              ><i></i><i></i><i></i><i></i></span
            ><span
              ><strong>双语对照</strong><small>原文与译文一起读</small></span
            ><span class="radio-dot" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            role="radio"
            data-value="translation"
            aria-checked="false"
            tabindex="-1"
          >
            <span class="mode-drawing translated" aria-hidden="true"
              ><i></i><i></i><i></i></span
            ><span><strong>仅看译文</strong><small>悬停可查看原文</small></span
            ><span class="radio-dot" aria-hidden="true"></span>
          </button>
        </div>
        <fieldset class="style-fieldset" id="styleGroup">
          <legend>译文呈现</legend>
          <div
            class="styles"
            role="radiogroup"
            aria-label="译文样式"
            id="translationStyle"
          >
            <button
              type="button"
              role="radio"
              data-value="plain"
              aria-checked="true"
              tabindex="0"
            >
              <span class="sample">Aa</span>跟随原文</button
            ><button
              type="button"
              role="radio"
              data-value="muted"
              aria-checked="false"
              tabindex="-1"
            >
              <span class="sample muted">Aa</span>柔和</button
            ><button
              type="button"
              role="radio"
              data-value="underline"
              aria-checked="false"
              tabindex="-1"
            >
              <span class="sample underline">Aa</span>点状下划线
            </button>
          </div>
          <p id="styleHint">保持网页原有的字体、字号与排版。</p>
        </fieldset>
      </section>
      <section class="main-action" aria-label="翻译操作">
        <button id="toggle" class="primary" type="button" disabled>
          <span id="toggleLabel">正在准备…</span
          ><span id="toggleIcon" aria-hidden="true">↗</span>
        </button>
        <p class="action-hint" id="actionHint">
          翻译只在本机进行，无需云端 API。
        </p>
      </section>
      <section class="learning" aria-labelledby="learningTitle">
        <div class="section-heading">
          <h2 id="learningTitle">词汇与复习</h2>
          <span id="dictState">离线词典</span>
        </div>
        <div class="learn-actions">
          <button type="button" class="learn-tile" id="openReview">
            <strong id="reviewCount">–</strong><span>今日复习</span>
          </button>
          <button type="button" class="learn-tile" id="openPanel">
            <strong aria-hidden="true">▍</strong><span>学习侧栏</span>
          </button>
          <button type="button" class="learn-tile" id="openCenter">
            <strong aria-hidden="true">↗</strong><span>学习中心</span>
          </button>
        </div>
        <p class="action-hint">选中英文单词或短语即可查词、收藏，不需要连接翻译服务。</p>
      </section>
    </main>
    <footer>
      <span>快捷键</span><span id="shortcutHint"><kbd>Alt</kbd> + <kbd>T</kbd></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
