# docker compose -f server/compose.yaml up -d --build      (run from the repository root)
#
# Put HTTPS in front of it (see server/README.md, e.g. Caddy). The container only
# speaks plain HTTP on port 8080, bound to localhost by default.
services:
  localingo:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: localingo-server:0.4.0
    restart: unless-stopped
    ports:
      # Host side configurable: LOCALINGO_BIND (default 127.0.0.1) + LOCALINGO_PORT
      # (default 8080). Set e.g. LOCALINGO_BIND=0.0.0.0 LOCALINGO_PORT=8083 to expose
      # the web app directly, or keep 127.0.0.1 and put a reverse proxy in front.
      - "${LOCALINGO_BIND:-127.0.0.1}:${LOCALINGO_PORT:-8080}:8080"
    environment:
      # First start only: creates this account if it doesn't exist. Remove afterwards.
      LOCALINGO_ADMIN_USER: ${LOCALINGO_ADMIN_USER:-}
      LOCALINGO_ADMIN_PASSWORD: ${LOCALINGO_ADMIN_PASSWORD:-}
      LOCALINGO_ALLOW_SIGNUP: ${LOCALINGO_ALLOW_SIGNUP:-false}
      LOCALINGO_DICT_VARIANT: ${LOCALINGO_DICT_VARIANT:-base}
    volumes:
      - localingo-data:/data

volumes:
  localingo-data:
