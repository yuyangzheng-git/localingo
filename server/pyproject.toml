[project]
name = "localingo-server"
version = "0.4.0"
description = "LocaLingo Learn sync server: accounts, vocabulary sync, dictionary API and the hosted learning web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pymysql>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[project.scripts]
localingo-server = "localingo_server.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
